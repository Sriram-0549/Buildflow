apiVersion: apps/v1
kind: Deployment
metadata:
    name: crash-test
spec:
    replicas: 1
    selector:
      matchLabels:
        app: crash-test

    template:
      metadata:
        labels:
          app: crash-test
      spec:
        containers:
          - name: crash-test
            image: buildflow-api
            command: ["sh", "-c"]
            args: ["exit 1"]
            imagePullPolicy: Never
            ports:
              - containerPort: 5000
            readinessProbe:
              httpGet:
                path: /health
                port: 5000
